name: Refresh prices

on:
  schedule:
    # 08:15 UTC = 12:15 AM PST
    - cron: '15 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update prices
        run: node scripts/update-prices.js
      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- site/assets/prices.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Prices unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/prices.js
          git commit -m "Refresh component prices"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A GITHUB_TOKEN push does not trigger the push workflow, so ask Pages to deploy explicitly.
        run: gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
